version: '3.9'

# SBRB local development infrastructure
# Redis: Redis Cloud (configured in .env)
# MinIO: local S3-compatible storage (replace AWS S3 in dev)

services:
  minio:
    image: minio/minio:latest
    container_name: sbrb-minio
    ports:
      - '9000:9000'   # API
      - '9001:9001'   # Console UI (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # MinIO bucket initializer (runs once, creates sbrb bucket)
  minio-init:
    image: minio/mc:latest
    container_name: sbrb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing local/sbrb;
      mc anonymous set download local/sbrb/public;
      echo 'MinIO bucket initialized';
      "
    restart: on-failure

volumes:
  minio_data:
    driver: local
